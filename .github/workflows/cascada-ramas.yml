# Cascada de ramas: main → pelican/desarrollo → refactor/residence-entrances, y main → dev.
#
# Arranca cuando el CI de un push a main o a pelican/desarrollo termina en verde: una rama rota no
# se propaga. La lógica está en .github/scripts/cascada.sh; cada cadena va en su propio paso para que
# un fallo en una no impida la otra (el job termina en rojo si falla cualquiera). Fusiona la rama superior en la inferior, pasa los tests sobre la fusión y solo
# entonces la sube. Las dos fusiones van en el mismo job porque un push hecho con GITHUB_TOKEN no
# dispara otro workflow (ni el CI): por eso los tests de la fusión se pasan aquí.
#
# Nunca reescribe historia ni fuerza un push. Si una fusión choca o sus tests fallan, no toca el
# destino: sube una rama cascada/<origen>-a-<destino> y abre un PR hacia el destino para
# resolverlo a mano (resolverlo en ese PR no toca la rama de origen).
name: Cascada de ramas

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, pelican/desarrollo]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cascada-ramas
  cancel-in-progress: false

jobs:
  cascada:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # La cascada cambia de rama en el checkout, y esas ramas pueden no tener el script (o tener otra
      # versión): se ejecuta una copia fuera del repositorio.
      - name: Preparar el script de la cascada
        run: cp .github/scripts/cascada.sh "$RUNNER_TEMP/cascada.sh"

      - name: Fusionar main en dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/cascada.sh" main dev

      - name: Fusionar main en pelican/desarrollo y en refactor/residence-entrances
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/cascada.sh" main pelican/desarrollo pelican/desarrollo refactor/residence-entrances
