version: '3.8'

services:
  stardew-server:
    image: junimoserver/server:latest
    container_name: pelican4ever-server
    restart: unless-stopped
    ports:
      - "24642:24642/udp" # Lidgren / Galaxy multiplayer port
      - "5900:5900"       # VNC port (opcional para depuración visual)
      - "8080:8080"       # Web GUI de JunimoServer
    environment:
      - STEAM_USERNAME=${STEAM_USERNAME}
      - STEAM_PASSWORD=${STEAM_PASSWORD}
      - SERVER_NAME=Pelican 4Ever Dedicated Server
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - USE_SEPARATE_WALLETS=true
      - DEDICATED_HOST_MODE=true
      - TZ=Europe/Madrid
    volumes:
      - ./data/saves:/root/.config/StardewValley/Saves
      - ./data/backups:/root/.config/StardewValley/Pelican4Ever_Backups
      - ./Pelican4Ever/bin/Debug/net6.0:/data/Mods/Pelican4Ever:ro
      - ./config.json:/data/Mods/Pelican4Ever/config.json
